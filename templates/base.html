<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}数据库管理工具{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 240px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #ffffff;
            width: var(--sidebar-width);
            transition: all 0.3s ease;
        }
        
        .sidebar-sticky {
            position: relative;
            top: 0;
            height: calc(100vh - 48px);
            padding-top: .5rem;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        .navbar-brand {
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }
        
        .content {
            margin-left: var(--sidebar-width);
            padding: 70px 20px 20px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }
        
        .nav-link {
            color: #495057;
            padding: 0.8rem 1.5rem;
            margin: 0.2rem 0;
            border-radius: 0;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            color: #007bff;
            background-color: #f8f9fa;
        }
        
        .nav-link.active {
            color: #007bff;
            background-color: #e9ecef;
            border-left: 4px solid #007bff;
        }
        
        .nav-link i {
            width: 20px;
            text-align: center;
            margin-right: 10px;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 20px;
            background-color: #ffffff;
        }
        
        .card-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 1rem;
        }
        
        .table {
            margin-bottom: 0;
        }
        
        .table th {
            border-top: none;
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .btn {
            border-radius: 5px;
            padding: 0.5rem 1rem;
            font-weight: 500;
        }
        
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* 响应式布局 */
        @media (max-width: 768px) {
            .sidebar {
                margin-left: calc(var(--sidebar-width) * -1);
            }
            
            .content {
                margin-left: 0;
            }
            
            .sidebar.show {
                margin-left: 0;
            }
            
            .content.shifted {
                margin-left: var(--sidebar-width);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <button class="navbar-toggler d-md-none" type="button" id="sidebarToggle">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="/">数据库管理工具</a>
            <div class="d-flex">
                <button class="btn btn-outline-light" onclick="cleanData()">
                    <i class="fas fa-broom"></i> 清理数据
                </button>
            </div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-sticky">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="fas fa-home"></i>概览
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/users' %}active{% endif %}" href="/users">
                        <i class="fas fa-users"></i>用户管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/videos' %}active{% endif %}" href="/videos">
                        <i class="fas fa-video"></i>视频管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/questions' %}active{% endif %}" href="/questions">
                        <i class="fas fa-question-circle"></i>问题管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/feedback' %}active{% endif %}" href="/feedback">
                        <i class="fas fa-comments"></i>反馈管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs">
                        <i class="fas fa-clipboard-list"></i>系统日志
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <!-- 自定义JS -->
    <script>
        // 侧边栏切换
        document.getElementById('sidebarToggle')?.addEventListener('click', function() {
            document.querySelector('.sidebar').classList.toggle('show');
            document.querySelector('.content').classList.toggle('shifted');
        });

        // 数据导出函数
        function exportData(table) {
            window.location.href = `/api/export/${table}`;
        }

        // 数据清理函数
        function cleanData() {
            if (confirm('确定要清理已删除的数据吗？此操作不可恢复！')) {
                $.post('/api/clean', {
                    _csrf_token: '{{ csrf_token() }}'
                })
                .done(function(response) {
                    if (response.success) {
                        alert('数据清理成功！');
                        location.reload();
                    } else {
                        alert('数据清理失败：' + response.message);
                    }
                })
                .fail(function(jqXHR, textStatus, errorThrown) {
                    alert('操作失败：' + (errorThrown || textStatus));
                });
            }
        }

        // 通用错误处理
        $(document).ajaxError(function(event, jqXHR, settings, thrownError) {
            if (jqXHR.status === 401) {
                alert('会话已过期，请重新登录');
                location.href = '/login';
            } else if (jqXHR.status === 403) {
                alert('权限不足，无法执行此操作');
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
